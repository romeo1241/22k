<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>22k store</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#09060f;--card:#140d22;--line:#2b1c47;--tx:#f4effd;--mut:#a093bd;--pri:#8b5cf6;--hot:#d946ef;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09060f}}
:root[data-theme="dark"]{--bg:#09060f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(9,6,15,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(9,6,15,.88);z-index:10}
.logo{font-weight:900;font-size:22px;letter-spacing:.5px;background:none;color:var(--tx);padding:0}
.logo b{color:var(--pri)}
.sp{flex:1}
.btn{background:var(--line);padding:8px 14px;border-radius:10px;font-weight:700;transition:transform .15s,background .2s}
.btn:active{transform:scale(.96)}
.pri{background:linear-gradient(135deg,var(--pri),var(--hot))}
.sm{padding:5px 10px;font-size:13px}
.bad{background:#4a1d24}.ok{background:#14513b}
main{max-width:1000px;margin:0 auto;padding:16px}
.view{animation:vin .35s ease both}
@keyframes vin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
[dir=rtl] .view{animation-name:vinr}
@keyframes vinr{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.hero{padding:36px 18px;border-radius:20px;border:1px solid var(--line);background:radial-gradient(circle at 80% 0,rgba(139,92,246,.35),transparent 55%),var(--card);margin-bottom:20px;overflow:hidden}
.hero h1{font-size:clamp(30px,7vw,52px);margin:0 0 8px;font-weight:900;line-height:1.15}
.hero h1 span{display:inline-block;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{text-shadow:0 0 28px var(--pri)}}
.hero p{color:var(--mut);margin:0 0 18px;max-width:46ch}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{background:var(--card);border:1px solid var(--line);padding:7px 16px;border-radius:99px;white-space:nowrap;color:var(--mut)}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--pri)}
.ico{font-size:42px;text-align:center;padding:14px 0;border-radius:12px;background:linear-gradient(160deg,#1d1236,#0d0818)}
.price{font-weight:900;font-size:18px}
.old{color:var(--mut);text-decoration:line-through;font-size:13px;margin-inline-start:6px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:#2b1c47;color:#d8c8ff;align-self:flex-start}
h2{margin:18px 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
input,select{width:100%;background:#0d0818;border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.st{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.s-new{background:#3b2a05;color:var(--warn)}.s-acc{background:#1e2a5e;color:#93b4ff}.s-del{background:#14513b;color:var(--ok)}.s-can{background:#4a1d24;color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:26px;display:block}
.stat span{color:var(--mut);font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:16px;max-width:420px;margin:auto;background:var(--pri);padding:12px 16px;border-radius:12px;text-align:center;font-weight:700;animation:vin .3s both;z-index:20}
.note{color:var(--mut);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(){try{localStorage.setItem("k22p",JSON.stringify(S.prods));localStorage.setItem("k22o",JSON.stringify(S.orders));localStorage.setItem("k22a",JSON.stringify(S.admins));localStorage.setItem("k22u",JSON.stringify(S.users));localStorage.setItem("k22s",JSON.stringify(S.cu))}catch(e){}}
function t(k){return T[S.lang][k]}
function go(v,x){S.view=v;if(x)S.tab=x;draw();window.scrollTo(0,0)}
function say(m){S.toast=m;draw(true);setTimeout(function(){S.toast="";var e=document.querySelector(".toast");if(e)e.remove()},1800)}
function nm(p){return p[S.lang]}
function cnt(){return S.cart.length}
function sum(){return S.cart.reduce(function(a,id){return a+S.prods.find(function(p){return p.id==id}).p},0)}
function stl(s){return {new:"s-new",acc:"s-acc",del:"s-del",can:"s-can"}[s]}

a.innerHTML='<div class="view">'+h+'</div>'+(S.toast?'<div class="toast">'+S.toast+'</div>':'');

function home(){
var cats=["all","games","discord","subs"];

function cartV(){
if(S.done)return '<div class="panel"><h2>✓ '+t("done")+S.done+'</h2><p>'+t("wait")+'</p><button class="btn pri" onclick="S.done=0;go(\'home\')">'+t("home")+'</button></div>';
if(!cnt())return '<div class="panel"><p>'+t("empty")+'</p><button class="btn pri" onclick="go(\'home\')">'+t("shop")+'</button></div>';

'<label>'+t("name")+'</label><input id="cn" value="'+esc(S.cu?S.cu.n:'')+'"><label>'+t("contact")+'</label><input id="cc" dir="ltr" value="'+esc(S.cu&&S.cu.c?S.cu.c:'')+'"><label>'+t("pay")+'</label><select id="cp">'+t("pm").map(function(m){return '<option>'+m+'</option>'}).join("")+'</select><br><button class="btn pri" style="width:100%" onclick="place()">'+t("order")+'</button></div><p class="note">'+t("demo")+'</p>'}
function place(){
var n=document.getElementById("cn").value.trim(),c=document.getElementById("cc").value.trim();
if(!n||!c){say("⚠ "+t("name")+" / "+t("contact"));return}
if(!S.cu){say("⚠ "+t("needlg"));go("acct");return}var id=1000+S.orders.length+1;S.cu.c=c;var ui=S.users.find(function(x){return x.e==S.cu.e});if(ui)ui.c=c;

S.cart=[];S.done=id;sv();draw()}

function ost(i,s){S.orders[i].s=s;sv();draw()}
function sp(i){var v=+document.getElementById("pp"+i).value;if(v>0){S.prods[i].p=v;sv();say("✓ "+t("saved"))}}
function ap(){var n=document.getElementById("an").value.trim(),p=+document.getElementById("ap").value;if(!n||!(p>0))return;
S.prods.push({id:Date.now(),c:document.getElementById("ac").value,ar:n,en:n,p:p,o:0,e:"🎮"});sv();draw();say("✓ "+t("added"))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function hs(p,s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+p)).then(function(d){return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
function salt(){return Array.from(crypto.getRandomValues(new Uint8Array(8))).map(function(x){return x.toString(16)}).join("")}
function val(i){return document.getElementById(i).value.trim()}
function acctV(){
if(S.cu){var mine=S.orders.filter(function(o){return o.u==S.cu.e});
return '<div class="row"><h2 style="flex:1">'+t("hi")+' '+esc(S.cu.n)+'</h2><button class="btn sm" onclick="S.cu=null;sv();draw()">'+t("logout")+'</button></div><div class="panel"><b>'+t("myord")+'</b>'+(mine.length?mine.map(function(o){return '<div class="line"><div><b>#'+o.id+'</b> <span class="st '+stl(o.s)+'">'+t(o.s)+'</span><br><span class="note">'+esc(o.d||"")+' · '+o.items.map(esc).join("، ")+' — '+o.total+' '+t("sar")+'</span></div><button class="btn sm pri" onclick="again('+o.id+')">'+t("again")+'</button></div>'}).join(""):'<p>'+t("noco")+'</p>')+'</div>'}
var r=S.atab=="reg";
return '<div class="panel"><div class="tabs"><button class="tab '+(!r?'on':'')+'" onclick="S.atab=\'login\';draw()">'+t("clogin")+'</button><button class="tab '+(r?'on':'')+'" onclick="S.atab=\'reg\';draw()">'+t("reg")+'</button></div>'+(r?'<label>'+t("name")+'</label><input id="rn">':'')+'<label>'+t("email")+'</label><input id="re" dir="ltr" type="email"><label>'+t("pass")+'</label><input id="rp" type="password"><br><button class="btn pri" style="width:100%" onclick="'+(r?'reg()':'clog()')+'">'+t(r?"reg":"clogin")+'</button></div><p class="note">'+t("demo")+'</p>'}
async function reg(){var n=val("rn"),e=val("re").toLowerCase(),p=document.getElementById("rp").value;
if(!n||!e||p.length<6){say("⚠ "+t("short"));return}
if(S.users.some(function(u){return u.e==e})){say("⚠ "+t("exists"));return}
var s=salt();S.users.push({n:n,e:e,s:s,h:await hs(p,s),c:""});S.cu={n:n,e:e,c:""};sv();draw();say("✓ "+t("hi")+" "+esc(n))}
async function clog(){var e=val("re").toLowerCase(),p=document.getElementById("rp").value,u=S.users.find(function(x){return x.e==e});
if(!u||await hs(p,u.s)!=u.h){say("⚠ "+t("bad"));return}
S.cu={n:u.n,e:u.e,c:u.c};sv();draw()}
function again(id){var o=S.orders.find(function(x){return x.id==id});S.cart=(o.ids||[]).slice();go("cart")}
function adminLogin(){var f=!S.admins.length;
return '<div class="panel"><h2>'+t(f?"setup":"login")+'</h2>'+(f?'<p class="note">'+t("setupn")+'</p>':'')+'<label>'+t("uname")+'</label><input id="au" dir="ltr" autocomplete="off"><label>'+t("pass")+'</label><input id="ap2" type="password"><br><button class="btn pri" style="width:100%" onclick="alog()">'+t(f?"setup":"login")+'</button></div>'}
async function alog(){var u=val("au").toLowerCase(),p=document.getElementById("ap2").value;
if(!S.admins.length){if(!u||p.length<8){say("⚠ "+t("short8"));return}
var s0=salt();S.admins.push({u:u,r:"manager",s:s0,h:await hs(p,s0)});sv();S.me=S.admins[0];S.user="manager";S.tab="dash";draw();return}
if(S.lock>=5){say("⚠ "+t("lock"));return}
var a=S.admins.find(function(x){return x.u==u});
if(!a||await hs(p,a.s)!=a.h){S.lock++;say("⚠ "+t("bad"));return}
S.lock=0;S.me=a;S.user=a.r;S.tab=a.r=="support"?"orders":"dash";draw()}
async function am(){var u=val("mn").toLowerCase(),p=document.getElementById("mp").value;
if(!u||p.length<8){say("⚠ "+t("short8"));return}
if(S.admins.some(function(x){return x.u==u})){say("⚠ "+t("exists"));return}
var s=salt();S.admins.push({u:u,r:document.getElementById("mr").value,s:s,h:await hs(p,s)});sv();draw();say("✓ "+t("added"))}
function rt(){if(location.hash=="#k22-admin"){S.view="admin";draw()}}
window.addEventListener("hashchange",rt);
draw();rt();
</script>
